<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CNOT Universe // Directory</title>

  <style>
    :root {
      --bg: #050608;
      --panel: rgba(10, 14, 18, 0.88);
      --text: #f2f2f2;
      --muted: #9ca3af;
      --red: #ff3b1f;
      --orange: #ff8a1f;
      --green: #39ff88;
      --line: rgba(255,255,255,.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(rgba(5,6,8,.86), rgba(5,6,8,.97)),
        radial-gradient(circle at 50% 10%, rgba(255,70,20,.18), transparent 32%),
        #050608;
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.025) 0,
          rgba(255,255,255,.025) 1px,
          transparent 1px,
          transparent 4px
        );
      opacity: .35;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 44px 0 72px;
      position: relative;
      z-index: 1;
    }

    header {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--green);
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: var(--red);
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      line-height: .95;
      letter-spacing: -.055em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255,59,31,.4);
    }

    .intro {
      margin: 18px 0 0;
      max-width: 720px;
      color: var(--muted);
      line-height: 1.6;
      font-size: .98rem;
    }

    .directory {
      margin-top: 34px;
    }

    .entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }

    .entry:first-child {
      border-top: 1px solid var(--line);
    }

    .entry-title {
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 1.4rem;
      line-height: 1.2;
    }

    .meta {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.7;
    }

    .meta strong {
      color: #d8d8d8;
      font-weight: normal;
    }

    .availability {
      min-width: 180px;
      text-align: right;
    }

    .availability-label {
      display: block;
      margin-bottom: 8px;
      color: var(--green);
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .link,
    .plain {
      display: inline-block;
      margin: 0 0 6px 8px;
      padding: 6px 9px;
      border: 1px solid rgba(255,255,255,.14);
      color: var(--text);
      text-decoration: none;
      font-size: .8rem;
      background: rgba(255,255,255,.025);
    }

    .link:hover {
      color: var(--green);
      border-color: var(--green);
    }

    .plain {
      color: var(--muted);
      cursor: default;
    }

    .empty,
    .error {
      padding: 28px 0;
      color: var(--muted);
    }

    footer {
      margin-top: 32px;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .05em;
    }

    @media (max-width: 680px) {
      .entry {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .availability {
        min-width: 0;
        text-align: left;
      }

      .link,
      .plain {
        margin-left: 0;
        margin-right: 6px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="eyebrow">CNOT Universe // Index</div>
      <h1>Directory</h1>
      <p class="intro">
        Opere e contenuti appartenenti all'universo narrativo CNOT.
        La directory registra le informazioni essenziali e i luoghi in cui ciascun contenuto è disponibile.
      </p>
    </header>

    <section class="directory" id="directory">
      <div class="empty">Caricamento indice…</div>
    </section>

    <footer>
      Data source: index.json
    </footer>
  </main>

  <script>
    (function () {
      "use strict";

      const container = document.getElementById("directory");

      function esc(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function renderAvailability(items) {
        if (!Array.isArray(items) || items.length === 0) {
          return '<span class="plain">—</span>';
        }

        return items.map(item => {
          const label = esc(item.label || item.type || "Apri");
          const url = (item.url || "").trim();

          if (!url) {
            return `<span class="plain">${label}</span>`;
          }

          return `<a class="link" href="${esc(url)}">${label} ↗</a>`;
        }).join("");
      }

      function renderEntry(item) {
        return `
          <article class="entry" data-id="${esc(item.id)}">
            <div>
              <h2 class="entry-title">${esc(item.title)}</h2>
              <div class="meta">
                <div><strong>Autore:</strong> ${esc(item.author)}</div>
                <div><strong>Anno:</strong> ${esc(item.year)}</div>
                <div><strong>Tipo:</strong> ${esc(item.type)}</div>
                <div><strong>Editore:</strong> ${esc(item.publisher)}</div>
              </div>
            </div>

            <div class="availability">
              <span class="availability-label">Disponibile su</span>
              ${renderAvailability(item.available)}
            </div>
          </article>
        `;
      }

      fetch("index.json")
        .then(response => {
          if (!response.ok) {
            throw new Error("Impossibile leggere index.json");
          }
          return response.json();
        })
        .then(items => {
          if (!Array.isArray(items) || items.length === 0) {
            container.innerHTML = '<div class="empty">Nessun contenuto nell’indice.</div>';
            return;
          }

          items.sort((a, b) => {
            const yearDiff = Number(b.year || 0) - Number(a.year || 0);
            if (yearDiff !== 0) return yearDiff;
            return String(a.title || "").localeCompare(String(b.title || ""), "it");
          });

          container.innerHTML = items.map(renderEntry).join("");
        })
        .catch(error => {
          console.error(error);
          container.innerHTML =
            '<div class="error">Errore nel caricamento dell’indice.</div>';
        });
    })();
  </script>
</body>
</html>
